<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Find Bus By Shashank</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
 body{margin:0;font-family:system-ui,sans-serif;background:#f4f5f7;color:#111;padding-top:env(safe-area-inset-top)}
 header{background:#0b5cab;color:#fff;padding:12px 14px;font-weight:600;font-size:18px}
 .ctl{padding:10px;display:grid;gap:8px;background:#fff}
 select,input,textarea,button{font-size:16px;padding:8px;border:1px solid #ccd;border-radius:8px;width:100%;box-sizing:border-box}
 button{background:#0b5cab;color:#fff;border:0;font-weight:600}
 button:disabled{opacity:.6}
 .row{display:flex;gap:8px;align-items:center}
 #status{padding:8px 12px;font-size:14px;color:#445}
 #map{height:300px}
 .card{background:#fff;margin:8px;padding:10px;border-radius:10px;border-left:5px solid #999}
 .card.live{border-color:#1a9a3a}.card.stationary{border-color:#d93025}
 .card{cursor:pointer}.card.sel{box-shadow:0 0 0 2px #0b5cab}
 .busicon{background:none;border:0}
 .legend{padding:0 12px 6px;font-size:13px;color:#445}
 .top{display:flex;justify-content:space-between;font-size:17px}
 .sub{font-size:13px;color:#556;margin-top:3px}
</style></head><body>
<header>🚌 Find Bus By Shashank</header>
<div class="ctl">
 <select id="origin"></select>
 <input id="custom" placeholder="26.47,81.12" style="display:none">
 <div class="row">
  <select id="radius"><option value="2">2 km</option><option value="5" selected>5 km</option><option value="10">10 km</option><option value="20">20 km</option></select>
  <label class="row" style="white-space:nowrap"><input type="checkbox" id="onlyLive" checked style="width:auto"> सिर्फ़ चालू</label>
 </div>
 <textarea id="mine" rows="2" placeholder="सिर्फ़ अपनी बसें देखनी हों तो नंबर डालें (खाली = सभी)"></textarea>
 <button id="btn">🔄 रिफ्रेश</button>
</div>
<div id="status"></div>
<div class="legend">🟢 चल रही &nbsp; 🔴 रुकी हुई &nbsp; (बस पर टैप करें तो नक्शे में दिखेगी)</div>
<div id="map"></div>
<div id="list"></div>
<script src="app.js"></script>
</body></html>
