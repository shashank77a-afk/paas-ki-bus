<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UP Bus Radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
 :root{--bg:#f3f4f7;--card:#fff;--text:#14161a;--sub:#5a6270;--line:#e3e6ec;--accent:#00796b}
 body.dark{--bg:#10131a;--card:#1b2029;--text:#eef1f6;--sub:#9aa5b5;--line:#2b3340;--accent:#4db6ac}
 *{box-sizing:border-box}
 body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top)}
 header{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;background:linear-gradient(135deg,#00574b,#00796b 55%,#26a69a)}
 header img{width:46px;height:46px;border-radius:50%}
 header .t{font-size:20px;font-weight:800;letter-spacing:.2px}
 header .s{font-size:12px;opacity:.92}
 header .grow{flex:1}
 #theme{width:auto;background:rgba(255,255,255,.2);color:#fff;font-size:18px;padding:6px 10px;border-radius:999px}
 .ctl{margin:10px;padding:12px;display:grid;gap:10px;background:var(--card);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
 select,input[type=text],button{font-size:16px;padding:10px;border:1px solid var(--line);border-radius:12px;width:100%;background:var(--card);color:var(--text)}
 button{border:0;font-weight:700;cursor:pointer}
 #btn{background:linear-gradient(135deg,#00695c,#00a190);color:#fff}
 #btn:disabled{opacity:.6}
 .row{display:flex;gap:8px;align-items:center}
 .pills{display:flex;flex-wrap:wrap;gap:8px}
 .pill input{position:absolute;opacity:0;pointer-events:none}
 .pill span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--card)}
 .pill input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
 #banner{display:none;margin:0 10px;padding:8px 12px;border-radius:10px;background:#fff3cd;color:#664d03;font-size:13px}
 #status{padding:8px 14px;font-size:14px;color:var(--sub)}
 .legend{padding:0 14px 8px;font-size:12.5px;color:var(--sub)}
 #map{height:38vh;min-height:230px;position:sticky;top:env(safe-area-inset-top,0px);z-index:500;border-bottom:3px solid var(--accent)}
 body.dark .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
 .busicon{background:none;border:0}
 .card{background:var(--card);margin:10px;padding:12px;border-radius:14px;border-left:6px solid #999;box-shadow:0 1px 5px rgba(0,0,0,.08);transition:box-shadow .2s}
 .card.live{border-color:#1a9a3a}.card.stationary{border-color:#d93025}
 .card.sel{box-shadow:0 0 0 3px #1565c0,0 4px 14px rgba(21,101,192,.35);background:linear-gradient(0deg,var(--card),var(--card))}
 .top{display:flex;align-items:center;gap:8px}
 .reg{font-size:19px;font-weight:800;flex:1}
 .dist{font-weight:700;color:var(--accent);font-size:16px}
 .star{width:auto;background:none;color:#f5a400;font-size:24px;padding:0 6px;line-height:1}
 .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
 .chip{font-size:12.5px;padding:3px 9px;border-radius:999px;font-weight:600}
 .chip.st.live{background:#d9f4e0;color:#0b6a25}.chip.st.stationary{background:#fde0de;color:#9c1c14}
 .chip.st.no_signal,.chip.st.under_maintenance{background:#e6e8ec;color:#444}
 .chip.depot{background:hsl(var(--h),75%,90%);color:hsl(var(--h),70%,22%)}
 body.dark .chip.depot{background:hsl(var(--h),35%,24%);color:hsl(var(--h),80%,86%)}
 .chip.age{background:#eef0f4;color:#444}
 body.dark .chip.age{background:#2b3340;color:#cdd5e0}
 .chip.warn,body.dark .chip.warn{background:#fff3cd;color:#664d03}
 .tr{font-weight:700;font-size:14.5px;margin:6px 0 2px}
 .tr.in{color:#118a37}.tr.out{color:#d93025}.tr.side{color:#b07400}.tr.near{color:#1565c0}
 .tr small{font-weight:400;opacity:.8}
 .line{font-size:13.5px;color:var(--sub);margin-top:4px}
 .line.zone{font-size:12px;opacity:.85}
 .arr{display:inline-block;font-weight:900;color:var(--accent);font-size:17px;line-height:1}
 .route{font-size:13.5px;margin-top:6px;font-weight:600}
 .route.none{font-weight:400;color:var(--sub)}
 .sep{margin:14px 14px 0;font-size:13.5px;font-weight:700;color:var(--accent)}
 .card.old{opacity:.72}
 .empty{padding:24px;text-align:center;color:var(--sub)}
 footer{text-align:center;padding:18px 10px 28px;color:var(--sub);font-size:13px}
 footer b{color:var(--accent)}
</style></head><body>
<header>
 <img src="logo.png" alt="">
 <div class="grow"><div class="t">UP Bus Radar</div><div class="s">Innovation by Shashank</div></div>
 <button id="theme">🌙</button>
</header>
<div class="ctl">
 <select id="origin"></select>
 <input id="custom" type="text" placeholder="26.47,81.12" style="display:none">
 <div class="row">
  <select id="radius"><option value="2">2 km</option><option value="5" selected>5 km</option><option value="10">10 km</option><option value="20">20 km</option></select>
 </div>
 <div class="pills">
  <label class="pill"><input type="checkbox" id="onlyLive" checked><span>सिर्फ़ चालू</span></label>
  <label class="pill"><input type="checkbox" id="onlyComing"><span>🟢 सिर्फ़ आ रही</span></label>
  <label class="pill"><input type="checkbox" id="favOnly"><span>⭐ मेरी बसें</span></label>
  <label class="pill"><input type="checkbox" id="auto"><span>🔁 अपने आप (2 मिनट)</span></label>
 </div>
 <input id="search" type="text" placeholder="🔍 बस नंबर या डिपो खोजें (जैसे UP32 या रायबरेली)">
 <button id="btn">🔄 रिफ्रेश</button>
</div>
<div id="banner"></div>
<div id="status"></div>
<div class="legend">🟢 चल रही &nbsp; 🔴 रुकी हुई &nbsp; ↗ तीर = बस जिधर जा रही है · बस पर टैप करें तो नक्शे/लिस्ट में चमकेगी</div>
<div id="map"></div>
<div id="list"></div>
<footer>🚌 <b>Innovation by Shashank</b><br><small>डेटा: UPSRTC मार्गदर्शी · अनौपचारिक ऐप, समय अनुमानित हो सकता है</small></footer>
<script src="app.js"></script>
</body></html>
